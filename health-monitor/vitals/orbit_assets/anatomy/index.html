<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StellarShield interactive astronaut</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f0f5ff;font:13px system-ui,sans-serif}.stage{height:560px;position:relative;overflow:hidden;border:1px solid #243552;border-radius:14px;background:radial-gradient(ellipse at 50% 42%,#1f3855 0%,#111d31 42%,#0b1221 75%)}.stage:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#35d6ff06 1px,transparent 1px),linear-gradient(90deg,#35d6ff06 1px,transparent 1px);background-size:32px 32px;pointer-events:none}model-viewer{display:block;width:100%;height:100%;--progress-bar-color:#35d6ff;--poster-color:transparent}#loading{position:absolute;top:45%;width:100%;text-align:center;color:#8fa4c5;pointer-events:none}.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font:10px monospace;letter-spacing:1px;color:#8fa4c5}.hud strong{color:#35d6ff;font-weight:500}#reset{position:absolute;bottom:18px;right:16px;background:#0c1428;border:1px solid #35506d;color:#b1eaff;border-radius:6px;padding:8px 10px;cursor:pointer}.hotspot{display:flex;align-items:center;gap:7px;border:1px solid #4e6689;border-radius:20px;padding:6px 10px;background:#0c1428ed;color:#cad7eb;font:11px system-ui;cursor:pointer;box-shadow:0 2px 12px #0008}.dot{width:7px;height:7px;border-radius:50%;background:#9b8cff;box-shadow:0 0 9px #9b8cff}.hotspot.active{border-color:#35d6ff;color:#b1eaff;background:#123349}.hotspot.active .dot{background:#35d6ff;box-shadow:0 0 12px #35d6ff}.hotspot:focus-visible,.organ-tab:focus-visible,#reset:focus-visible{outline:2px solid #ffbe55;outline-offset:3px}.hint{position:absolute;bottom:20px;left:16px;max-width:65%;font:9px monospace;letter-spacing:.5px;color:#8fa4c5;pointer-events:none}#organ-tabs{display:flex;gap:7px;flex-wrap:wrap;padding:12px 2px}.organ-tab{background:#111d35;border:1px solid #243552;color:#c2d0e2;border-radius:6px;padding:8px 11px;font:11px system-ui;cursor:pointer}.organ-tab.active{border-color:#35d6ff;color:#b1eaff;background:#153345}.credit{font:9px system-ui;color:#8fa4c5;margin:0 2px}.credit a{color:#8fa4c5}
</style></head><body><div class="stage"><model-viewer src="Astronaut.glb" alt="Interactive three-dimensional astronaut with selectable health regions" camera-controls camera-orbit="0deg 80deg 3.8m" camera-target="0m 1m 0m" field-of-view="30deg" min-camera-orbit="auto 15deg 2.6m" max-camera-orbit="auto 165deg 6m" shadow-intensity="1" exposure="1.1" interaction-prompt="none" touch-action="pan-y"></model-viewer><div id="loading">Loading astronaut…</div><div class="hud"><span>INTERACTIVE BODY MAP</span><strong id="selected">HEART</strong></div><button id="reset" type="button">Reset view</button><div class="hint" id="status">LOADING 3D MODEL</div></div><nav id="organ-tabs" aria-label="Body region"></nav><p class="credit">Astronaut by Poly · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">CC BY 2.0</a> · Illustrative body map</p><script src="bundle.js"></script></body></html>
